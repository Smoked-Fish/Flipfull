name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: |
          node src/kaiva/test/commands.test.js

      - name: Shell scripts parse
        run: |
          for f in userinit/flipfull userinit/run.sh \
                   $(find userinit src/release -name '*.sh'); do
            sh -n "$f" || exit 1
          done

      - name: Build (no speech models)
        run: python -c "import sys; sys.path.insert(0, 'src'); import build; build.build([t for t in build.TARGETS if t != 'stt'])"
