<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Camera</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/model.js"></script>
  <script defer src="js/mp4.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-view="camera" data-state="opening">
  <div id="viewfinder">
    <video id="preview" muted></video>
    <div id="picture"><div id="grid"></div></div>
  </div>
  <div id="blink"></div>

  <header id="top"><span id="mode"></span><span id="icons"></span></header>
  <div id="zoom"></div>
  <div id="status"></div>

  <section id="options"><div id="rows"></div></section>
  <section id="keys"><div id="key-list"></div></section>

  <section id="review">
    <img id="review-image" alt="">
    <video id="review-video" preload="auto"></video>
    <p id="review-info"></p>
  </section>

  <div id="toast" role="status"></div>
  <div id="dialog" role="alertdialog"><p id="dialog-text"></p></div>

  <footer id="softkeys">
    <span id="sk-left"></span>
    <span id="sk-center"></span>
    <span id="sk-right"></span>
  </footer>
</body>
</html>
