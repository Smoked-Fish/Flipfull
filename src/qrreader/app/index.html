<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>QR Reader</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/vendor/jsQR.js"></script>
  <script defer src="js/parse.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-view="scan">
  <header id="title">QR Reader</header>
  <main>
    <section id="scan">
      <video id="video" muted playsinline></video>
      <div id="frame" aria-hidden="true"></div>
      <p id="hint"></p>
    </section>
    <section id="result">
      <p id="kind"></p>
      <p id="value"></p>
      <ul id="lines"></ul>
      <p id="status" role="status"></p>
    </section>
    <section id="history">
      <ul id="history-list"></ul>
      <p id="history-empty">No codes scanned yet</p>
    </section>
  </main>
  <footer id="softkeys">
    <span id="sk-left"></span>
    <span id="sk-center"></span>
    <span id="sk-right"></span>
  </footer>
</body>
</html>
