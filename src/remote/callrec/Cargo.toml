[package]
name = "flipfull_callrec"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flipfull-callrec"
path = "src/main.rs"

[dependencies]
bincode = "1.3"
common = { path = "../api-daemon/common" }
flipfull_remote = { path = "../common" }
log = "0.4"
nix = "0.19"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
common = { path = "../api-daemon/common" }
