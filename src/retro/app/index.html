<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>GBA</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="http://127.0.0.1/api/v1/shared/core.js"></script>
    <script defer src="http://127.0.0.1/api/v1/shared/session.js"></script>
    <script defer src="http://127.0.0.1/flipfull/retro.js"></script>
    <script defer src="js/player.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body data-view="loading">
<header id="bar"><span id="bar-title"></span><span id="bar-count"></span></header>
<main>
    <section id="loading"><p class="text" id="loading-text">Loading…</p></section>

    <section id="offline">
        <p class="text">Flipfull's GBA service isn't answering. Turn on GBA games in the Flipfull app</p>
        <p class="text muted" id="offline-why"></p>
    </section>

    <section id="list">
        <p class="hint" id="scanning"></p>
        <div id="games"></div>
        <p class="text muted" id="empty">No games yet. Copy .gba, .gbc, or .gb files into a folder called games on the phone's storage.</p>
    </section>

    <section id="play">
        <div id="frame">
            <canvas id="screen" width="240" height="160"></canvas>
            <pre id="fps"></pre>
        </div>
        <p id="status" role="status"></p>
    </section>

    <section id="menu"><div id="menu-items"></div></section>

    <section id="slots"><div id="slot-items"></div></section>

    <section id="settings">
        <div id="setting-items"></div>
        <p class="hint" id="setting-about"></p>
    </section>

    <section id="keys">
        <p class="hint" id="keys-hint"></p>
        <div id="key-items"></div>
    </section>
</main>

<div id="toast" role="status"></div>
<div id="dialog" role="alertdialog"><p id="dialog-text"></p></div>

<footer id="softkeys">
    <span id="sk-left"></span>
    <span id="sk-center"></span>
    <span id="sk-right"></span>
</footer>
</body>
</html>
