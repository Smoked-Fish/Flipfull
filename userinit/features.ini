[ad-block]
title = Block ads
section = Ads and privacy
about = Apps that ask KaiAds for an ad get none. The ad servers are blocked and the ads SDK is replaced with a stub.
default = off
hosts = ads
reboot = yes

[music-no-ads]
title = Music without ads
about = No banner or radio ads in the Music app.
default = off
overlays = music

[video-no-ads]
title = Video without ads
about = Video keeps its YouTube picks, without the ad at start, the ad above the video list or the ads code.
default = off
overlays = video

[block-telemetry]
title = Block usage reports
about = KaiOS's event logger, which sends your usage and your app list to KaiOS, doesn't start, and api-daemon stops its app usage reports. Mozilla's telemetry is off, and the servers KaiOS and TCL send reports to are blocked.
default = off
overlays = system
hosts = telemetry
prefs = telemetry
reboot = yes

[tracker-blocking]
title = Tracker blocking
about = The browser and apps block known trackers, with Mozilla's lists that are already on the phone.
default = off
prefs = tracking

[block-updates]
title = Block system updates
about = A system update removes root and Flipfull. This keeps the updaters off, blocks TCL's update server and stops the phone's update checks.
default = off
overlays = system
hosts = updates
reboot = yes
ask-off = Without this the phone can update itself, and an update removes root and Flipfull. Turn it off anyway?

[block-app-updates]
title = Block KaiStore auto-updates
about = Apps stop updating on their own, like KaiStore's Auto-update: Off. You can still update them in KaiStore. An update to Music or Video replaces Flipfull's versions without ads until Flipfull is installed again.
default = off
reboot = yes

[home-shortcuts]
title = Home screen shortcuts
section = Home screen
about = Settings > Display > Home Screen Shortcuts picks an app for each arrow key, and for holding 0 or 2-9 in the dialer.
default = off
overlays = launcher settings

[no-side-menu]
title = Centered clock, no side menu
about = No side menu on the home screen (the apps behind Left), and the clock and carrier name are centered.
default = off
overlays = launcher

[no-folders]
title = No Games and Utilities folders
about = Games and utilities are listed with the other apps instead of in two folders. Turn it off to get the folders back.
default = off
overlays = launcher

[clock-seconds]
title = Seconds on the clock
about = The home screen clock shows the seconds too, small, next to the minutes. It ticks only while you can see it.
default = off
overlays = launcher

[metro-name]
title = Carrier name: Metro
about = The home screen calls a Metro by T-Mobile SIM just Metro (and Metro Wi-Fi Calling with Wi-Fi Calling). Settings and the other screens keep the full name.
default = off
overlays = launcher

[live-wallpaper]
title = Animated wallpapers
about = MP4, GIF and WebP wallpapers, set like any other. They play only while you can see them. MP4 support is unfinished.
default = off
overlays = shared wallpaper system

[outer-screen-info]
title = Next alarm on the outer screen
section = Outer screen and music
about = The outer screen shows your next alarm under the clock, and how many calls you missed and messages you haven't read.
default = off
overlays = system

[outer-screen-music]
title = Album cover on the outer screen
about = While Music plays, the outer screen shows the song's album cover behind the clock, with a bar for how far into the song you are. It needs Music without ads, which is turned on with it.
default = off
overlays = system music
requires = music-no-ads

[track-skip]
title = Skip tracks with the phone closed
about = While music plays and the phone is closed, hold Volume up for the next track or Volume down for the previous one. If the outer screen is dark, the first press only lights it, unless Volume keys with the screen off is on.
default = off
overlays = system

[volume-keys]
title = Volume keys with the screen off
about = While music plays, Volume up and down change the volume at the first press even when the screen is off, open or closed, instead of only lighting the screen.
default = off
overlays = system

[play-pause-button]
title = Pause with the quick access button
about = With the phone closed and the outer screen lit, one press of the quick access button on the outside pauses the music, and another plays it again. With the outer screen dark, a press only lights it. Two presses (camera) and three (quick call) work as before.
default = off
overlays = system

[outer-screen-timeout]
title = Outer screen timeout
about = Settings > Display > Sub-screen timeout: how long the outer screen stays lit, from 10 seconds (as it comes) up to 10 minutes, or never. Longer times use more battery.
default = off
overlays = settings system

[call-recording]
title = Call recording
section = Calls and voice
about = Settings > Call Settings > Call Recording: record both sides of a call when you press Left, or every call. Recordings are .m4a files in the callrecording folder. Recording laws differ; some places require everyone on the call to agree.
default = off
overlays = callscreen settings
services = callrec

[kaiva]
title = KaiVA voice assistant
about = A voice assistant that works without the internet: hold OK on the home screen.
default = off
overlays = launcher
services = stt
apps = kaiva

[dictation]
title = Dictation in text fields
about = Hold OK in any text field except passwords to dictate, recognized on the phone by KaiVA.
default = off
overlays = keyboard
requires = kaiva

[web-speech]
title = Speech recognition for websites
about = Websites that use the Web Speech API get their speech recognized on the phone, by KaiVA's speech service.
default = off
prefs = webspeech
services = stt

[qrreader]
title = QR Reader
section = Apps
about = Reads QR codes with the camera or from a photo: links, Wi-Fi networks (it joins them), contacts, phone numbers and more.
default = off
apps = qrreader

[maps]
title = Google Maps navigation
about = In Google Maps, Go on a route starts turn-by-turn navigation with spoken directions, and the "Signed in as" bar stops covering the map at every start.
default = off
overlays = system

[recording-quality]
title = Recording quality
about = Recorder > Options > Settings > Recording Quality goes from 8 up to 128 kbps instead of only 8 or 44. The stock 8 kbps cuts off everything above about 4 kHz.
default = off
overlays = soundrecorder

[flipstore]
title = Flipstore app store
about = Installs Flipstore, an app store for apps made for this phone, and lets it install apps. It shows what each app can reach before you install it, and updates only from its own releases. Needs the internet when you turn it on.
default = off

[google-accounts]
title = Google accounts
section = System
about = Google blocks KaiOS's own sign-in, so adding a Google account needs your own sign-in client: see Options > Google sign-in client. Accounts added with it stop syncing if you turn this off.
default = off
overlays = system

[boot-animation]
title = Your start-up animation
about = The start-up animation installed with Flipfull (media/bootanimation.zip, and bootanimation_external.zip for the outer screen) instead of the carrier's, and the start-up logo Flipfull was built with, if any.
default = off
overlays = system
reboot = yes

[boot-sound]
title = Your start-up sound
about = The start-up sound installed with Flipfull (media/poweron-sound.wav) instead of the carrier's. A short silent file makes the phone start silently.
default = off
reboot = yes

[network-type]
title = Network type in SIM details
about = Settings shows the preferred network type (5G, LTE, 3G) in the SIM's details, which carrier builds hide.
default = off
overlays = settings

[no-battery-full]
title = No Battery Full notification
about = The phone no longer posts a Battery Full notification when it finishes charging. The charging sound and the low battery warning stay.
default = off
overlays = system

[memory-tuning]
title = Smoother apps
about = The JavaScript memory manager is tuned for this phone's 1.6 GB of RAM instead of 256 MB phones: fewer and shorter pauses in heavy apps.
default = off
prefs = gc

[color-emoji]
title = Colour emoji
about = Emoji in full colour, with the Noto Color Emoji font that's already on the phone.
default = off
prefs = emoji
