[ad-block]
title = Block ads
section = Ads and privacy
about = Apps that show KaiAds get "no ad" at once instead of an ad, and the ad servers are blocked for every app and the browser.
default = on
hosts = ads
reboot = yes

[music-no-ads]
title = Music without ads
about = Music keeps its front page and internet radio, without the ad at start, the ads in the lists or the ads code.
default = on
overlays = music

[no-telemetry]
title = No usage reports
about = KaiOS's event logger, which sends your usage and your list of apps to KaiOS, doesn't start. Mozilla's telemetry is off and the report servers are blocked.
default = on
overlays = system
hosts = telemetry
prefs = telemetry

[tracker-blocking]
title = Tracker blocking
about = The browser and apps block known trackers, with Mozilla's lists that are already on the phone.
default = on
prefs = tracking

[home-shortcuts]
title = Home screen shortcuts
section = Home screen
about = Settings > Display > Home Screen Shortcuts picks an app for each arrow key, and for holding 0 or 2-9 in the dialer. Right opens Camera until you change it. Changes work at once.
default = on
overlays = launcher settings

[no-folders]
title = No Games and Utilities folders
about = Games and utilities are listed with the other apps instead of in two folders. Turn it off to get the folders back.
default = off
overlays = launcher

[live-wallpaper]
title = Animated wallpapers
about = MP4, GIF and WebP wallpapers, set like any other. They play only while you can see them.
default = on
overlays = shared wallpaper system

[outer-screen-info]
title = Outer screen info
about = The outer screen shows your next alarm, missed calls and unread messages under the clock.
default = on
overlays = system

[track-skip]
title = Skip tracks with the phone closed
about = While music plays and the phone is closed, hold Volume up for the next track or Volume down for the previous one.
default = on
overlays = system

[call-recording]
title = Call recording
section = Calls and voice
about = Settings > Call Settings > Call Recording: record both sides of a call when you press Left, or every call. Recordings are .m4a files in the callrecording folder. Recording laws differ; some places require everyone on the call to agree.
default = off
overlays = callscreen settings
services = callrec

[kaiva]
title = KaiVA voice assistant
about = A voice assistant that works without the internet: hold OK on the home screen. It calls, texts, opens apps and settings, and sets alarms. Dictate is uninstalled; KaiVA replaces it.
default = off
overlays = launcher
services = stt
apps = kaiva

[dictation]
title = Dictation in text fields
about = Hold OK in any text field except passwords to dictate, recognized on the phone by KaiVA.
default = off
overlays = keyboard
requires = kaiva

[web-speech]
title = Speech recognition for websites
about = Websites that use the Web Speech API get their speech recognized on the phone, by KaiVA's speech service.
default = off
prefs = webspeech
services = stt

[qrreader]
title = QR Reader
section = Apps
about = Reads QR codes with the camera or from a photo: links, Wi-Fi networks (it joins them), contacts, phone numbers and more.
default = on
apps = qrreader

[maps]
title = Google Maps navigation
about = In Google Maps, Go on a route starts turn-by-turn navigation with spoken directions, and the "Signed in as" bar stops covering the map at every start.
default = on
overlays = system

[google-accounts]
title = Google accounts
about = Google blocks KaiOS's own sign-in, so adding a Google account needs your own sign-in client: see Options > Google sign-in client. Accounts added with it stop syncing if you turn this off.
default = off
overlays = system

[no-updates]
title = Block system updates
section = System
about = A system update removes root and Flipfull. This keeps the updaters off, blocks TCL's update server and stops the phone's update checks.
default = on
overlays = system
hosts = updates
reboot = yes
ask-off = Without this the phone can update itself, and an update removes root and Flipfull. Turn it off anyway?

[silent-boot]
title = Silent start-up
about = No sound when the phone starts.
default = off
reboot = yes

[boot-animation]
title = Flipfull start-up animation
about = Flipfull's own start-up animation on both screens, and one start-up logo instead of the carrier's.
default = off
overlays = system
reboot = yes

[network-type]
title = Network type in SIM details
about = Settings shows the preferred network type (5G, LTE, 3G) in the SIM's details, which carrier builds hide.
default = on
overlays = settings

[memory-tuning]
title = Smoother apps
about = The JavaScript memory manager is tuned for this phone's 1.6 GB of RAM instead of 256 MB phones: fewer and shorter pauses in heavy apps.
default = on
prefs = gc

[color-emoji]
title = Colour emoji
about = Emoji in full colour, with the Noto Color Emoji font that's already on the phone.
default = on
prefs = emoji
