# Ads and Privacy

[block-updates]
title = Block system updates
section = Ads and Privacy
about = A system update removes root and Flipfull. This keeps the system updater off, blocks TCL's and KaiOS's update servers and stops the phone's update checks.
default = on
overlays = system
hosts = updates
reboot = yes
ask-off = Without this the phone can update itself, and an update removes root and Flipfull. Turn it off anyway?

[ad-block]
title = Block ads
about = Apps that ask KaiAds for an ad get none. The ad servers are blocked and the ads SDK is replaced with a stub.
default = off
hosts = ads
reboot = yes

[block-telemetry]
title = Block usage reports
about = KaiOS's event logger, api-daemon app usage reports, Mozilla's telemetry, and the servers KaiOS and TCL send reports to are blocked.
default = off
overlays = system
hosts = telemetry
prefs = telemetry
reboot = yes

[tracker-blocking]
title = Tracker blocking
about = The browser and apps block known trackers, with Mozilla's lists that are already on the phone.
default = off
prefs = tracking

[block-app-updates]
title = Block KaiStore auto-updates
about = Apps stop updating on their own. You can still update them in KaiStore.
default = off
reboot = yes

# Home Screen

[home-shortcuts]
title = Home screen shortcuts
section = Home Screen
about = Settings > Display > Home Screen Shortcuts picks an app for each arrow key, and for holding 0 or 2-9 in the dialer.
default = off
overlays = launcher settings

[no-side-menu]
title =  No side menu
about = Removes side menu on the home screen, and the clock and carrier name are centered.
default = off
overlays = launcher

[no-folders]
title = No App Folders
about = Games and utilities are listed with the other apps instead of in two folders. Turn it off to get the folders back.
default = off
overlays = launcher

[clock-seconds]
title = Seconds on the clock
about = The home screen clock shows the seconds next to the minutes.
default = off
overlays = launcher

[metro-name]
title = Carrier name: Metro
about = The home screen calls a Metro by T-Mobile SIM just Metro (and Metro Wi-Fi Calling with Wi-Fi Calling).
default = off
overlays = launcher

[live-wallpaper]
title = Animated wallpapers
about = MP4, GIF and WebP wallpapers, set like any other. They play only while you can see them. MP4 and WebP support is unfinished.
default = off
overlays = shared wallpaper system

[alert-volume]
title = Separate alert volume
about = Up on the home screen shows a Ringtones slider and an Alerts slider instead of Ringtones & Alerts, so message and app sounds get their own volume. With ringtones on silent or vibrate, alerts are silent too.
default = off
dev = yes
overlays = system

[media-volume]
title = Media volume on the home screen
about = Up on the home screen also shows a Media slider, so you can set the media volume before anything plays.
default = off
dev = yes
overlays = system

# Outer Screen

[outer-screen-info]
title = Next alarm on the outer screen
section = Outer Screen
about = The outer screen shows your next alarm under the clock, how many calls you missed and messages you haven't read.
default = off
overlays = system

[outer-screen-music]
title = Album cover on the outer screen
about = While Music plays, the outer screen shows the song's album cover behind the clock, with a bar for how far into the song you are. It needs Music without ads, which is turned on with it.
default = off
overlays = system music
requires = music-no-ads

[track-skip]
title = Skip tracks with the phone closed
about = While music plays and the phone is closed, hold Volume up for the next track or Volume down for the previous one. If the outer screen is dark, the first press only lights it, unless Volume keys with the screen off is on.
default = off
overlays = system

[volume-keys]
title = Volume keys with the screen off
about = While music plays, Volume up and down change the volume at the first press even when the screen is off, open or closed, instead of only lighting the screen.
default = off
overlays = system

[play-pause-button]
title = Pause with the quick access button
about = With the phone closed and the outer screen lit, one press of the quick access button on the outside pauses the music, and another plays it again. With the outer screen dark, a press only lights it. Two presses (camera) and three (quick call) work as before.
default = off
overlays = system

[outer-screen-timeout]
title = Outer screen timeout
about = Settings > Display > Sub-screen timeout: how long the outer screen stays lit, from 10 seconds (default) up to 10 minutes, or never if you really want that for some reason. Longer times use more battery.
default = off
overlays = settings system

[call-recording]
title = Call recording
section = Calls and Voice
about = Settings > Call Settings > Call Recording: record both sides of a call when you press Left, or every call. Recordings are .m4a files in the callrecording folder. There is about a half second of delay when turning on call recording. Recording laws differ, some places require everyone on the call to agree.
default = off
overlays = callscreen settings
services = callrec

[kaiva]
title = KaiVA voice assistant
about = A voice assistant that works without the internet. Adds many more settings for you to explore in the KaiVA app too.
default = off
overlays = launcher
services = stt
apps = kaiva

[dictation]
title = Dictation in text fields
about = Hold OK in any text field except passwords to dictate, recognized on the phone by KaiVA.
default = off
overlays = keyboard
requires = kaiva

[web-speech]
title = Speech recognition for websites
about = Websites that use the Web Speech API get their speech recognized on the phone, by KaiVA's speech service. I don't know if this will ever be used.
default = off
prefs = webspeech
services = stt

# Apps

[flipstore]
title = Flipstore app store
section = Apps
about = Installs Flipstore, an app store that relies on Flipfull service's. It shows what each app can reach before you install it, and updates only from its own releases. Needs the internet when you turn it on.
default = off

[music-no-ads]
title = Music without ads
about = No banner or radio ads in the Music app.
default = off
overlays = music

[video-no-ads]
title = Video without ads
about = Video keeps its YouTube picks, without the ad at start, the ad above the video list or the ads code.
default = off
overlays = video

[video-no-youtube]
title = Video without YouTube
about = Video no longer suggests YouTube searches. It needs Video without ads, which is turned on with it.
default = off
overlays = video
requires = video-no-ads

[camera-frame-rates]
title = Steady camera frame rates
about = Adds video profile for at 24 frames. Flipcam (name pending), from Flipstore, uses them to keep its viewfinder steady in the dark instead of dropping to 10 frames a second, and to record 1080p and 720p video at 24 as well as 30. The stock Camera doesn't use them and works as before.
default = off
reboot = yes

[maps]
title = Google Maps navigation
about = In Google Maps, Go on a route starts turn-by-turn navigation with spoken directions, and the "Signed in as" bar stops covering the map at every start. (WIP)
default = off
dev = yes
overlays = system

# System

[google-accounts]
title = Google accounts
section = System
about = Google blocks KaiOS's own sign-in, so adding a Google account needs your own sign-in client: see Options > Google sign-in client. Accounts added with it stop syncing if you turn this off.
default = off
overlays = system

[boot-animation]
title = Your start-up animation
about = The start-up animation in the boot folder of the phone's storage (bootanimation.zip, and bootanimation_external.zip for the outer screen) instead of the carrier's.
default = off
overlays = system
reboot = yes

[power-off-animation]
title = Your power-off animation
about = The power-off animation in the boot folder of the phone's storage (carrier_power_off.mp4) instead of the carrier's. The MP4 also controlls the power off sound.
default = off
overlays = system
reboot = yes

[boot-sound]
title = Your start-up sound
about = The start-up sound in the boot folder of the phone's storage (poweron-sound.wav) instead of the carrier's. A short silent file makes the phone start silently.
default = off
reboot = yes

[boot-logo]
title = Your start-up logo
about = The logo shown after the start-up animation while the phone loads (initlogo.png) in the boot folder of the phone's storage, instead of the carrier's.
default = off
overlays = system
reboot = yes

[network-type]
title = Network type in SIM details
about = Settings shows the preferred network type (5G, LTE, 3G) in the SIM's details, which carrier builds hide.
default = off
overlays = settings

[no-battery-full]
title = No Battery Full notification
about = The phone no longer posts a Battery Full notification when it finishes charging. The charging sound and the low battery warning stay.
default = off
overlays = system

[memory-tuning]
title = Smoother apps
about = The JavaScript memory manager is tuned for 1.6 GB of RAM instead of 256 MB
default = off
prefs = gc